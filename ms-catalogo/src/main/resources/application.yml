spring:
  application:
    name: ms-catalogo
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/${DB_NAME:mesatech}}
    username: ${DB_USER:mesatech}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    virtual-host: ${RABBITMQ_VHOST:mesatech}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    connection-timeout: 5s
    # Confirmaciones del broker y retorno de mensajes sin ruta (mandatory)
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

app:
  rabbitmq:
    exchange: ${RABBITMQ_EXCHANGE:catalogo.exchange}
    routing-key: ${RABBITMQ_ROUTING_KEY:categoria.creada}
    confirm-timeout-ms: ${RABBITMQ_CONFIRM_TIMEOUT_MS:10000}

server:
  port: 8082

---
# Configuracion adicional para perfil prod (se activa con SPRING_PROFILES_ACTIVE=prod)
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ENTRA_ISSUER_URI}
          audiences: ${ENTRA_AUDIENCE}

---
# Configuracion adicional para perfil dev
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
