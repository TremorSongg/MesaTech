spring:
  application:
    name: ms-solicitudes
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/${DB_NAME:mesatech}}
    username: ${DB_USER:mesatech}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    virtual-host: ${RABBITMQ_VHOST:mesatech}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    connection-timeout: 5s
    listener:
      simple:
        # Consumir un mensaje a la vez
        concurrency: 1
        max-concurrency: 1
        prefetch: 1
        # Confirmar (ack) despues de procesar correctamente
        acknowledge-mode: auto
        # Reencolar ante errores de procesamiento recuperables
        default-requeue-rejected: true

app:
  rabbitmq:
    queue: ${RABBITMQ_QUEUE:solicitudes.catalogo.queue}

server:
  port: 8081

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ENTRA_ISSUER_URI}
          audiences: ${ENTRA_AUDIENCE}

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
